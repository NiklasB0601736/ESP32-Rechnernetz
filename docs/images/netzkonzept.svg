<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title description">
  <title id="title">ESP32-Netz: Frontend, Backend und teilvermaschtes Funknetz</title>
  <desc id="description">Das Frontend gibt Ereignisse, Knotenwerte, Partnerzahl und Kriterien vor. Das Backend führt Tabellen zusammen und berechnet Routen. Ein seriell angebundener Master sammelt Meldungen aus einem teilweise verbundenen ESP32-Netz, auch über Zwischenknoten. Ein Regelkreis führt von der Initialisierung über Messung und Sammlung zur Berechnung und Verteilung neuer Routen. Die gezeichneten Knoten und Kanten sind nur ein Beispiel.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4.5L0 9Z" fill="#53667a"/></marker>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 5L0 10Z" fill="#078175"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 5L0 10Z" fill="#426ac4"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#1a3047}
      .heading{font-size:23px;font-weight:700}
      .label{font-size:17px}
      .small{font-size:13px;fill:#627589}
      .flow{font-size:12px;font-weight:600}
      .node{font-size:20px;font-weight:700;text-anchor:middle}
      .step{font-size:16px;font-weight:600;text-anchor:middle}
    </style>
  </defs>

  <rect width="1280" height="780" rx="20" fill="#f4f7fb"/>
  <text x="40" y="51" font-size="29" font-weight="700">ESP32-Netz</text>
  <text x="40" y="78" class="small">Konzept · drei Komponenten · zentraler Regelkreis</text>
  <rect x="1050" y="30" width="190" height="33" rx="16" fill="#e5edf9"/>
  <text x="1145" y="51" text-anchor="middle" font-size="12" font-weight="600" fill="#426ac4">IDEE / NOCH KEINE UMSETZUNG</text>

  <!-- Drei Komponenten -->
  <rect x="40" y="140" width="240" height="340" rx="18" fill="#ffffff" stroke="#cfdced"/>
  <rect x="40" y="140" width="240" height="69" rx="18" fill="#e8effc"/>
  <path d="M40 190H280V209H40Z" fill="#e8effc"/>
  <text x="64" y="184" class="heading">Frontend</text>
  <text x="64" y="242" class="label">Ereignisse</text>
  <text x="64" y="284" class="label">Knotenwerte · N</text>
  <text x="64" y="326" class="label">Zielkriterien</text>
  <path d="M64 351H256" stroke="#e1e8f2"/>
  <text x="64" y="388" font-size="20" font-weight="600" fill="#426ac4">Netzansicht</text>
  <text x="64" y="449" class="small">Nutzer steuert und beobachtet</text>

  <rect x="360" y="140" width="270" height="340" rx="18" fill="#ffffff" stroke="#cfdced"/>
  <rect x="360" y="140" width="270" height="69" rx="18" fill="#e3f2ef"/>
  <path d="M360 190H630V209H360Z" fill="#e3f2ef"/>
  <text x="384" y="184" class="heading">Backend</text>
  <text x="384" y="242" class="label">Tabellen zusammenführen</text>
  <text x="384" y="284" class="label">Graph + Dijkstra</text>
  <text x="384" y="326" class="label">Routen berechnen</text>
  <path d="M384 351H606" stroke="#e1e8f2"/>
  <text x="384" y="388" font-size="20" font-weight="600" fill="#078175">Gemeinsamer Netzstand</text>
  <text x="384" y="449" class="small">Zentrale Verarbeitung auf dem PC</text>

  <rect x="710" y="100" width="530" height="430" rx="18" fill="#ffffff" stroke="#cfdced"/>
  <text x="734" y="142" class="heading">Netz</text>
  <text x="734" y="168" class="small">ESP32 · teilweise verbunden</text>

  <!-- Bedienung und Zustand -->
  <path d="M282 250H357" stroke="#426ac4" stroke-width="2.5" fill="none" marker-end="url(#blueArrow)"/>
  <text x="320" y="232" class="flow" text-anchor="middle" fill="#426ac4">Vorgaben</text>
  <path d="M357 370H283" stroke="#078175" stroke-width="2.5" fill="none" marker-end="url(#tealArrow)"/>
  <text x="320" y="393" class="flow" text-anchor="middle" fill="#078175">Netzbild</text>

  <!-- Nur der Master hat eine serielle Verbindung zum Backend -->
  <path d="M632 250H735L767 290" stroke="#426ac4" stroke-width="2.5" fill="none" marker-end="url(#blueArrow)"/>
  <text x="670" y="232" class="flow" text-anchor="middle" fill="#426ac4">Routen</text>
  <path d="M766 331L735 370H633" stroke="#078175" stroke-width="2.5" fill="none" marker-end="url(#tealArrow)"/>
  <text x="670" y="393" class="flow" text-anchor="middle" fill="#078175">JSON</text>
  <text x="671" y="299" font-size="11" text-anchor="middle" fill="#627589">USB / seriell</text>

  <!-- Beispieltopologie: maximal drei gezeichnete Partner je Knoten -->
  <g stroke="#b6c5d6" stroke-width="3" fill="none">
    <path d="M790 310L960 230H1150V410H960L790 310"/>
    <path d="M960 230V410"/>
  </g>
  <!-- Ein Ursprungsbericht erreicht den Master ueber einen Zwischenknoten -->
  <path d="M1118 230H994" stroke="#078175" stroke-width="4" fill="none" marker-end="url(#tealArrow)"/>
  <path d="M929 245L821 296" stroke="#078175" stroke-width="4" fill="none" marker-end="url(#tealArrow)"/>
  <text x="1056" y="306" text-anchor="middle" font-size="14" font-weight="600">RSSI · Latenz</text>
  <text x="1056" y="327" text-anchor="middle" class="small">je Nachbar</text>
  <g>
    <circle cx="790" cy="310" r="30" fill="#fff0dc" stroke="#cb8a2d" stroke-width="2"/>
    <text x="790" y="317" class="node" fill="#a66516">M</text>
    <text x="790" y="363" text-anchor="middle" font-size="15" font-weight="700">Master</text>
    <circle cx="960" cy="230" r="28" fill="#e5f4f0" stroke="#078175" stroke-width="2"/>
    <text x="960" y="237" class="node">A</text>
    <circle cx="960" cy="410" r="28" fill="#f1f5fa" stroke="#9aafc6" stroke-width="2"/>
    <text x="960" y="417" class="node">B</text>
    <circle cx="1150" cy="230" r="28" fill="#e5f4f0" stroke="#078175" stroke-width="2"/>
    <text x="1150" y="237" class="node">C</text>
    <circle cx="1150" cy="410" r="28" fill="#f1f5fa" stroke="#9aafc6" stroke-width="2"/>
    <text x="1150" y="417" class="node">D</text>
  </g>
  <rect x="734" y="479" width="139" height="28" rx="14" fill="#f0f4fa"/>
  <text x="803" y="498" text-anchor="middle" font-size="12">N Partner je Knoten</text>
  <rect x="885" y="479" width="196" height="28" rx="14" fill="#f0f4fa"/>
  <text x="983" y="498" text-anchor="middle" font-size="12">TX: fest oder zufällig</text>

  <!-- Kurze Legende -->
  <path d="M735 555H766" stroke="#b6c5d6" stroke-width="3"/>
  <text x="776" y="559" class="small">Partnerverbindung</text>
  <path d="M962 555H992" stroke="#078175" stroke-width="3" marker-end="url(#tealArrow)"/>
  <text x="1003" y="559" class="small">Tabelle zum Master</text>

  <!-- Zusammenfassung des zeitlichen Ablaufs -->
  <text x="40" y="589" font-size="12" font-weight="700" letter-spacing="1.8" fill="#627589">ABLAUF</text>
  <g>
    <rect x="40" y="610" width="190" height="66" rx="12" fill="#e8effc"/>
    <text x="135" y="635" text-anchor="middle" font-size="11" fill="#627589">01</text>
    <text x="135" y="658" class="step">Initialisieren</text>
    <rect x="290" y="610" width="190" height="66" rx="12" fill="#ffffff" stroke="#cfdced"/>
    <text x="385" y="635" text-anchor="middle" font-size="11" fill="#627589">02</text>
    <text x="385" y="658" class="step">Nachbarn messen</text>
    <rect x="540" y="610" width="190" height="66" rx="12" fill="#ffffff" stroke="#cfdced"/>
    <text x="635" y="635" text-anchor="middle" font-size="11" fill="#627589">03</text>
    <text x="635" y="658" class="step">Tabellen sammeln</text>
    <rect x="790" y="610" width="190" height="66" rx="12" fill="#ffffff" stroke="#cfdced"/>
    <text x="885" y="635" text-anchor="middle" font-size="11" fill="#627589">04</text>
    <text x="885" y="658" class="step">Routen berechnen</text>
    <rect x="1040" y="610" width="200" height="66" rx="12" fill="#e3f2ef"/>
    <text x="1140" y="635" text-anchor="middle" font-size="11" fill="#627589">05</text>
    <text x="1140" y="658" class="step">Routen verteilen</text>
  </g>
  <g stroke="#53667a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M242 643H279"/><path d="M492 643H529"/><path d="M742 643H779"/><path d="M992 643H1029"/>
  </g>
  <path d="M1140 685V714H385V686" fill="none" stroke="#9aafc6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <rect x="648" y="702" width="196" height="25" fill="#f4f7fb"/>
  <text x="746" y="719" text-anchor="middle" class="small">nächste Messrunde</text>
  <text x="40" y="757" class="small">Beispieltopologie · Routenverteilung noch auszuarbeiten · Dijkstra und Partnerauswahl getrennt präzisieren</text>
</svg>
